name: Build webOS TV package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "config.js"
      - "webos-app/**"
      - "native-probe/**"
      - "native-media-probe/**"
      - "desktop-probe/**"
      - ".github/workflows/build-webos.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install webOS CLI and esbuild
        run: npm install --global @webos-tools/cli esbuild

      - name: Assemble packaged app
        run: |
          mkdir -p build/webos-app
          cp webos-app/appinfo.json build/webos-app/
          cp webos-app/index.html webos-app/webOSTV.js webos-app/tv-transcoder.js build/webos-app/
          cp styles.css config.js build/webos-app/
          # webOS 6.x runs Chromium 79; transpile syntax introduced after Chrome 79.
          esbuild app.js --target=chrome79 --outfile=build/webos-app/app.js
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          image = Image.new("RGB", (80, 80), "#08090d")
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((4, 4, 76, 76), radius=16, fill="#8b5cf6")
          draw.polygon([(31, 21), (31, 59), (60, 40)], fill="#ffffff")
          image.save("build/webos-app/icon.png")
          image.resize((130, 130)).save("build/webos-app/largeicon.png")
          PY

      - name: Build native ARM probe
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg
          SDK_ARCHIVE="$RUNNER_TEMP/webos-native-sdk.tar.gz"
          SDK_URL="https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 "$SDK_URL" -o "$SDK_ARCHIVE"
          echo "2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344  $SDK_ARCHIVE" | sha256sum -c -
          tar -xzf "$SDK_ARCHIVE" -C "$RUNNER_TEMP"
          SDK="$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot"
          "$SDK/relocate-sdk.sh"
          source "$SDK/environment-setup"
          echo "Target SDL2: $(pkg-config --modversion sdl2)"
          cmake -S native-probe -B build/native-probe \
            -DCMAKE_TOOLCHAIN_FILE="$SDK/share/buildroot/toolchainfile.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-probe --parallel 2
          # Fetch a bounded excerpt of the real S02E02 MKV from the configured Drive library.
          mkdir -p build/native-media-probe/package
          python3 - <<'PY'
          import json, re, subprocess, urllib.error, urllib.parse
          from pathlib import Path

          config = Path("config.js").read_text()
          folder = re.search(r'folderId:\s*"([^"]+)"', config)
          key = re.search(r'apiKey:\s*"([^"]+)"', config)
          if not folder or not key:
              raise SystemExit("Drive configuration is incomplete.")
          root_id, api_key = folder.group(1), key.group(1)
          worker = "https://drive-tv-player.contatosyntropy.workers.dev"
          visited, matches = set(), []

          def children(parent):
              token = ""
              while True:
                  params = {
                      "q": f"'{parent}' in parents and trashed = false",
                      "pageSize": "1000",
                      "fields": "nextPageToken,files(id,name,mimeType,size)",
                      "key": api_key
                  }
                  if token:
                      params["pageToken"] = token
                  url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode(params)
                  try:
                      listing = subprocess.run(
                          ["curl", "-fsSL", "--retry", "3", "--connect-timeout", "15", "--max-time", "30",
                           "-H", "Referer: " + worker + "/", url],
                          check=True, capture_output=True, text=True
                      )
                      payload = json.loads(listing.stdout)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", "replace")[:600].replace(api_key, "[redacted]")
                      raise SystemExit(f"Google Drive API HTTP {exc.code}: {detail}")
                  except Exception as exc:
                      detail = repr(exc).replace(api_key, "[redacted]")
                      raise SystemExit("Google Drive listing failed: " + detail[:600])
                  for item in payload.get("files", []):
                      if item.get("mimeType") == "application/vnd.google-apps.folder":
                          if item["id"] not in visited:
                              visited.add(item["id"])
                              yield from children(item["id"])
                      else:
                          yield item
                  token = payload.get("nextPageToken", "")
                  if not token:
                      break

          all_mkv = []
          for item in children(root_id):
              name = item.get("name", "")
              if name.lower().endswith(".mkv"):
                  all_mkv.append(item)
              if "DICKHEAD" in name.upper() or "S02E02" in name.upper():
                  matches.append(item)
          if not matches:
              examples = [item.get("name", "") for item in all_mkv[:30]]
              raise SystemExit("No S02E02/Dickhead MKV found. MKV count=" +
                               str(len(all_mkv)) + "; examples=" + repr(examples))
          matches.sort(key=lambda item: ("DICKHEAD" in item.get("name", "").upper(),
                                         int(item.get("size", 0))), reverse=True)
          item = matches[0]
          safe_name = urllib.parse.quote(item["name"], safe="")
          media_url = f"{worker}/api/video/{item['id']}/{safe_name}?key={urllib.parse.quote(api_key)}"
          output_path = Path("build/native-media-probe/source.mkv")
          header_path = Path("build/native-media-probe/source-headers.txt")
          try:
              download = subprocess.run(
                  ["curl", "-fLsS", "--retry", "3", "--connect-timeout", "15", "--max-time", "120",
                   "-H", "Range: bytes=0-33554431", "-D", str(header_path),
                   "-o", str(output_path), "-w", "%{http_code}", media_url],
                  check=True, capture_output=True, text=True
              )
          except subprocess.CalledProcessError as exc:
              detail = (exc.stderr or "curl failed").replace(api_key, "[redacted]")
              raise SystemExit("Worker MKV range download failed: " + detail[:600])
          if download.stdout.strip() != "206":
              raise SystemExit(f"Worker did not honor the byte range (HTTP {download.stdout.strip()}).")
          data = output_path.read_bytes()
          if not data:
              raise SystemExit("The MKV range response was empty.")
          content_range = next((line.split(":", 1)[1].strip() for line in header_path.read_text().splitlines()
                                if line.lower().startswith("content-range:")), "")
          print(f"Retrieved {len(data)} bytes from the real Drive MKV ({content_range}).")
          print("Selected source: " + item["name"])
          PY
          # Extract five seconds without re-encoding. Convert length-prefixed HEVC to Annex-B
          # and insert AUD NAL units so the native feed can submit complete access units.
          ffmpeg -hide_banner -loglevel warning -probesize 64M -analyzeduration 10M \
            -i build/native-media-probe/source.mkv -map 0:v:0 -an -sn -dn -t 5 -c:v copy \
            -bsf:v hevc_mp4toannexb,hevc_metadata=aud=insert -f hevc \
            build/native-media-probe/package/sample.hevc || true
          test -s build/native-media-probe/package/sample.hevc
          ffprobe -v error -select_streams v:0 -show_entries stream=profile,width,height,pix_fmt,r_frame_rate \
            -of json build/native-media-probe/source.mkv > build/native-media-probe/source-video.json || true
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          meta = json.loads(Path("build/native-media-probe/source-video.json").read_text())
          streams = meta.get("streams", [])
          if not streams:
              raise SystemExit("FFprobe could not identify the real MKV video stream.")
          video = streams[0]
          print("Real source video:", video)
          if video.get("width") != 1920 or video.get("height") != 960:
              raise SystemExit("Unexpected source dimensions; refusing to package a mismatched test.")
          if "10" not in video.get("profile", ""):
              raise SystemExit("The selected Drive video is not identified as HEVC Main 10.")
          data = Path("build/native-media-probe/package/sample.hevc").read_bytes()
          starts = list(re.finditer(b"\x00\x00(?:\x00)?\x01", data))
          types = [(data[m.end()] >> 1) & 0x3f for m in starts if m.end() + 1 < len(data)]
          vcl = sum(1 for t in types if t <= 31)
          aud = types.count(35)
          print(f"Real HEVC excerpt: {len(data)} bytes, {len(starts)} Annex-B NALs, {vcl} VCL NALs, {aud} AUDs")
          if not starts or not vcl or not aud:
              raise SystemExit("The extracted HEVC excerpt has no complete parseable access units.")
          PY
          cmake -S native-media-probe -B build/native-media-probe -DCMAKE_TOOLCHAIN_FILE="$SDK/share/buildroot/toolchainfile.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-media-probe --parallel 2

          cp native-media-probe/appinfo.json build/native-media-probe/package/
          cp build/native-media-probe/drive-tv-native-media-probe build/native-media-probe/package/
          test -s build/native-media-probe/package/sample.hevc
          ls -lh build/native-media-probe/package/sample.hevc
          mkdir -p build/native-probe/package
          cp native-probe/appinfo.json build/native-probe/package/
          cp build/native-probe/drive-tv-native-probe build/native-probe/package/
          python3 - <<'PY'
          import struct, zlib
          width = height = 80
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  inside = 5 <= x < 75 and 5 <= y < 75
                  check = (21 <= x < 59 and 21 <= y < 59 and
                           (x in (21, 22, 57, 58) or y in (21, 22, 57, 58)))
                  if check:
                      row.extend((255, 255, 255))
                  elif inside:
                      row.extend((139, 92, 246))
                  else:
                      row.extend((8, 9, 13))
              rows.append(bytes(row))
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)
          png = (b"\\x89PNG\\r\\n\\x1a\\n" +
                 chunk(b"IHDR", struct.pack(">2I5B", width, height, 8, 2, 0, 0, 0)) +
                 chunk(b"IDAT", zlib.compress(b"".join(rows), 9)) +
                 chunk(b"IEND", b""))
          with open("build/native-probe/package/icon.png", "wb") as f:
              f.write(png)
          PY
          cp build/native-probe/package/icon.png build/native-media-probe/package/icon.png
          file build/native-probe/package/drive-tv-native-probe
          readelf -h build/native-probe/package/drive-tv-native-probe | grep -E 'Class:|Machine:'

      - name: Package IPKs
        run: |
          mkdir -p dist/web-app dist/native-probe dist/native-media-probe
          ares-config --profile tv
          ares-package --no-minify --outdir dist/web-app ./build/webos-app
          ares-package --no-minify --outdir dist/native-probe ./build/native-probe/package
          ares-package --no-minify --outdir dist/native-media-probe ./build/native-media-probe/package
          test -n "$(find dist/web-app -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$(find dist/native-probe -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$(find dist/native-media-probe -maxdepth 1 -type f -name '*.ipk' -print -quit)"

      - name: Upload webOS player package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-player-webos-ipk
          path: dist/web-app/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native ARM probe package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-native-probe-ipk
          path: dist/native-probe/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native hardware media probe package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-native-media-probe-ipk
          path: dist/native-media-probe/*.ipk
          if-no-files-found: error
          retention-days: 14

  desktop-test-kit:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download FFmpeg Windows Essentials
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $download = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          curl.exe -fL --retry 5 --retry-all-errors --connect-timeout 30 $download -o $archive
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the FFmpeg Windows package." }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Directory | Select-Object -First 1
          if (!$bin) { throw "FFmpeg archive did not contain its expected directory." }
          New-Item -ItemType Directory -Force -Path "dist/desktop-test-kit/bin" | Out-Null
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" "dist/desktop-test-kit/bin/"
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" "dist/desktop-test-kit/bin/"
          Copy-Item "$($bin.FullName)/bin/ffplay.exe" "dist/desktop-test-kit/bin/"
          if (Test-Path "$($bin.FullName)/LICENSE.txt") { Copy-Item "$($bin.FullName)/LICENSE.txt" "dist/desktop-test-kit/" }
          Copy-Item "desktop-probe/Run-DriveTV-Test.ps1" "dist/desktop-test-kit/"
          Copy-Item "desktop-probe/Run-DriveTV-Test.bat" "dist/desktop-test-kit/"
          Copy-Item "desktop-probe/README.md" "dist/desktop-test-kit/"
          Compress-Archive -Path "dist/desktop-test-kit/*" -DestinationPath "dist/drive-tv-desktop-test-kit-windows.zip" -Force

      - name: Upload Windows desktop test kit
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-desktop-test-kit-windows
          path: dist/drive-tv-desktop-test-kit-windows.zip
          if-no-files-found: error
          retention-days: 14
