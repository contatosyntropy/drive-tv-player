name: Build webOS TV package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "config.js"
      - "webos-app/**"
      - "native-probe/**"
      - "native-media-probe/**"
      - "desktop-probe/**"
      - ".github/workflows/build-webos.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install webOS CLI and esbuild
        run: npm install --global @webos-tools/cli esbuild

      - name: Assemble packaged app
        run: |
          mkdir -p build/webos-app
          cp webos-app/appinfo.json build/webos-app/
          cp webos-app/index.html webos-app/webOSTV.js webos-app/tv-transcoder.js build/webos-app/
          cp styles.css config.js build/webos-app/
          # webOS 6.x runs Chromium 79; transpile syntax introduced after Chrome 79.
          esbuild app.js --target=chrome79 --outfile=build/webos-app/app.js
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          image = Image.new("RGB", (80, 80), "#08090d")
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((4, 4, 76, 76), radius=16, fill="#8b5cf6")
          draw.polygon([(31, 21), (31, 59), (60, 40)], fill="#ffffff")
          image.save("build/webos-app/icon.png")
          image.resize((130, 130)).save("build/webos-app/largeicon.png")
          PY

      - name: Build native ARM probe
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg
          SDK_ARCHIVE="$RUNNER_TEMP/webos-native-sdk.tar.gz"
          SDK_URL="https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 "$SDK_URL" -o "$SDK_ARCHIVE"
          echo "2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344  $SDK_ARCHIVE" | sha256sum -c -
          tar -xzf "$SDK_ARCHIVE" -C "$RUNNER_TEMP"
          SDK="$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot"
          "$SDK/relocate-sdk.sh"
          source "$SDK/environment-setup"
          echo "Target SDL2: $(pkg-config --modversion sdl2)"
          cmake -S native-probe -B build/native-probe \
            -DCMAKE_TOOLCHAIN_FILE="$SDK/share/buildroot/toolchainfile.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-probe --parallel 2
          # Generate a short H.264 elementary stream for the hardware decoder test.
          mkdir -p build/native-media-probe/package
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=1280x720:rate=24' -t 5 -an -c:v libx264 -preset ultrafast -profile:v main -pix_fmt yuv420p -x264-params 'aud=1:keyint=48:min-keyint=48:scenecut=0:bframes=0' -f h264 build/native-media-probe/package/sample.h264
          cmake -S native-media-probe -B build/native-media-probe -DCMAKE_TOOLCHAIN_FILE="$SDK/share/buildroot/toolchainfile.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-media-probe --parallel 2

          cp native-media-probe/appinfo.json build/native-media-probe/package/
          cp build/native-media-probe/drive-tv-native-media-probe build/native-media-probe/package/
          mkdir -p build/native-probe/package
          cp native-probe/appinfo.json build/native-probe/package/
          cp build/native-probe/drive-tv-native-probe build/native-probe/package/
          python3 - <<'PY'
          import struct, zlib
          width = height = 80
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  inside = 5 <= x < 75 and 5 <= y < 75
                  check = (21 <= x < 59 and 21 <= y < 59 and
                           (x in (21, 22, 57, 58) or y in (21, 22, 57, 58)))
                  if check:
                      row.extend((255, 255, 255))
                  elif inside:
                      row.extend((139, 92, 246))
                  else:
                      row.extend((8, 9, 13))
              rows.append(bytes(row))
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)
          png = (b"\\x89PNG\\r\\n\\x1a\\n" +
                 chunk(b"IHDR", struct.pack(">2I5B", width, height, 8, 2, 0, 0, 0)) +
                 chunk(b"IDAT", zlib.compress(b"".join(rows), 9)) +
                 chunk(b"IEND", b""))
          with open("build/native-probe/package/icon.png", "wb") as f:
              f.write(png)
          PY
          cp build/native-probe/package/icon.png build/native-media-probe/package/icon.png
          file build/native-probe/package/drive-tv-native-probe
          readelf -h build/native-probe/package/drive-tv-native-probe | grep -E 'Class:|Machine:'

      - name: Package IPKs
        run: |
          mkdir -p dist/web-app dist/native-probe dist/native-media-probe
          ares-config --profile tv
          ares-package --no-minify --outdir dist/web-app ./build/webos-app
          ares-package --no-minify --outdir dist/native-probe ./build/native-probe/package
          ares-package --no-minify --outdir dist/native-media-probe ./build/native-media-probe/package
          test -n "$(find dist/web-app -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$(find dist/native-probe -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$(find dist/native-media-probe -maxdepth 1 -type f -name '*.ipk' -print -quit)"

      - name: Upload webOS player package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-player-webos-ipk
          path: dist/web-app/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native ARM probe package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-native-probe-ipk
          path: dist/native-probe/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native hardware media probe package
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-native-media-probe-ipk
          path: dist/native-media-probe/*.ipk
          if-no-files-found: error
          retention-days: 14

  desktop-test-kit:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download FFmpeg Windows Essentials
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Directory | Select-Object -First 1
          if (!$bin) { throw "FFmpeg archive did not contain its expected directory." }
          New-Item -ItemType Directory -Force -Path "dist/desktop-test-kit/bin" | Out-Null
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" "dist/desktop-test-kit/bin/"
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" "dist/desktop-test-kit/bin/"
          Copy-Item "$($bin.FullName)/bin/ffplay.exe" "dist/desktop-test-kit/bin/"
          Copy-Item "desktop-probe/Run-DriveTV-Test.ps1" "dist/desktop-test-kit/"
          Copy-Item "desktop-probe/Run-DriveTV-Test.bat" "dist/desktop-test-kit/"
          Copy-Item "desktop-probe/README.md" "dist/desktop-test-kit/"
          Compress-Archive -Path "dist/desktop-test-kit/*" -DestinationPath "dist/drive-tv-desktop-test-kit-windows.zip" -Force

      - name: Upload Windows desktop test kit
        uses: actions/upload-artifact@v4
        with:
          name: drive-tv-desktop-test-kit-windows
          path: dist/drive-tv-desktop-test-kit-windows.zip
          if-no-files-found: error
          retention-days: 14
