<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Drive TV Player</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">▶</span><span>DRIVE<span class="muted">PLAYER</span></span></div>
    <div class="top-actions"><span id="status" class="status">Preparando biblioteca…</span><button id="refresh" class="icon-button" aria-label="Atualizar biblioteca">↻</button></div>
  </header>
  <main id="library">
    <section class="hero">
      <p class="eyebrow">SUA BIBLIOTECA</p>
      <h1>Escolha o que assistir.</h1>
      <p class="subheading">Seus vídeos do Google Drive, em um só lugar.</p>
    </section>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Navegação de pastas"></nav>
    <div id="message" class="message">Carregando vídeos…</div>
    <section id="videos" class="video-grid" aria-label="Vídeos"></section>
  </main>
  <section id="player" class="player hidden" aria-label="Player da TV">
    <div id="player-overlay" class="player-overlay">
      <button id="close-player" class="player-control-button" type="button">← Voltar</button>
      <span id="now-playing" class="now-playing"></span>
      <div class="player-actions">
        <button id="toggle-subtitle" class="player-control-button hidden" type="button">Legenda: ON</button>
        <button id="next-episode" class="player-control-button next-episode-button hidden" type="button">Próximo →</button>
        <button id="fallback-drive" class="player-control-button" type="button">Player do Drive</button>
      </div>
    </div>
    <p id="playback-message" class="playback-message hidden" role="status"></p>
    <video id="video" class="tv-video" controls playsinline preload="metadata" crossorigin="anonymous"></video>
    <iframe id="drive-preview" class="drive-preview hidden" title="Reprodução do Google Drive" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>
  <script src="./webOSTV.js" onerror="void 0"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
